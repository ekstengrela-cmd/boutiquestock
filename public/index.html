<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BoutiqueStock</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BoutiqueStock">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ÉCRAN DE CONNEXION -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-icon">👕</div>
        <h1>BoutiqueStock</h1>
        <p>Gestion de stock et ventes</p>
      </div>
      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label for="login-username">Identifiant</label>
          <input type="text" id="login-username" placeholder="Votre identifiant" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" placeholder="Votre mot de passe" required autocomplete="current-password">
        </div>
        <div id="login-error" class="error-banner" hidden></div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Se connecter</button>
      </form>
    </div>
  </div>

  <!-- APPLICATION PRINCIPALE -->
  <div id="app-screen" class="app-screen" hidden>

    <!-- OVERLAY MOBILE (ferme le sidebar) -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar(false)"></div>

    <!-- HEADER MOBILE -->
    <header class="mobile-header" id="mobile-header">
      <button class="hamburger" onclick="toggleSidebar(true)" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="mobile-title">
        <span>👕</span> BoutiqueStock
      </div>
      <button class="dark-toggle-mobile" onclick="toggleDark()" aria-label="Mode sombre">
        <span id="dark-icon-mobile">🌙</span>
      </button>
    </header>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <span class="sidebar-logo-icon">👕</span>
          <div>
            <div class="sidebar-app-name">BoutiqueStock</div>
            <div id="sidebar-role" class="role-badge"></div>
          </div>
        </div>
        <button class="dark-toggle" onclick="toggleDark()" aria-label="Mode sombre">
          <span id="dark-icon">🌙</span>
        </button>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar" id="user-avatar"></div>
          <div class="user-info">
            <div id="sidebar-username" class="user-name"></div>
            <button onclick="logout()" class="btn-logout">Déconnexion</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- CONTENU PRINCIPAL -->
    <main class="main-content" id="main-content">
      <div id="view-container" class="view-container"></div>
    </main>

  </div>

  <!-- MODALE -->
  <div id="modal-overlay" class="modal-overlay" hidden onclick="handleOverlayClick(event)">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- TOASTS -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ZONE D'IMPRESSION -->
  <div id="print-area"></div>

  <script src="/js/app.js"></script>
</body>
</html>
